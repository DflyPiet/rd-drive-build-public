name: RD Drive 1.0.0 Windows Final Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout encrypted build carrier
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Rust MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo --version
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Build and verify installed plus portable RD Drive
        shell: pwsh
        env:
          RD_BUILD_KEY: ${{ secrets.RD_BUILD_KEY }}
        run: .\ci\build-rd-drive-final.ps1

      - name: Upload RD Drive Windows final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RD-Drive-1.0.0-Windows-FINAL
          path: release-artifacts-final/**/*
          if-no-files-found: error
          retention-days: 7
