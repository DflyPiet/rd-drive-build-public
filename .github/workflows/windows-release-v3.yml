name: RD Drive 1.0.0 Windows Final Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout encrypted build carrier
        uses: actions/checkout@v4

      - name: Reconstruct, verify and decrypt RD Drive source
        shell: pwsh
        env:
          RD_BUILD_KEY: ${{ secrets.RD_BUILD_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $partNames = @(
            'payload/rd-drive.enc.b64.00',
            'payload/rd-drive.enc.b64.01',
            'payload/rd-drive.enc.b64.02',
            'payload/rd-drive.enc.b64.03',
            'payload/rd-drive.enc.b64.04',
            'payload/rd-drive.enc.b64.05',
            'payload/rd-drive.enc.b64.06a',
            'payload/rd-drive.enc.b64.06b',
            'payload/rd-drive.enc.b64.07',
            'payload/rd-drive.enc.b64.08',
            'payload/rd-drive.enc.b64.09'
          )
          foreach ($part in $partNames) {
            if (-not (Test-Path $part)) { throw "Missing encrypted payload fragment: $part" }
          }
          $b64 = ($partNames | ForEach-Object { Get-Content -Raw $_ }) -join ''
          [IO.File]::WriteAllBytes('rd-drive-ci-source.enc', [Convert]::FromBase64String($b64))
          $encryptedHash = (Get-FileHash -Algorithm SHA256 'rd-drive-ci-source.enc').Hash.ToLowerInvariant()
          if ($encryptedHash -ne '0ee2f7ab3567c73c19571a4738d63549c9eeef74a07a63a044013835ad30b6da') { throw "Encrypted payload SHA256 mismatch: $encryptedHash" }
          if ($env:RD_BUILD_KEY -notmatch '^[0-9a-fA-F]{64}$') { throw 'RD_BUILD_KEY secret is missing or invalid.' }
          [byte[]]$key = for ($i = 0; $i -lt 64; $i += 2) { [Convert]::ToByte($env:RD_BUILD_KEY.Substring($i, 2), 16) }
          [byte[]]$blob = [IO.File]::ReadAllBytes('rd-drive-ci-source.enc')
          if ($blob.Length -lt 35) { throw 'Encrypted payload is too short.' }
          if ([Text.Encoding]::ASCII.GetString($blob[0..5]) -ne 'RDENC1') { throw 'Invalid encrypted payload magic.' }
          [byte[]]$nonce = $blob[6..17]
          [byte[]]$tag = $blob[18..33]
          [byte[]]$cipher = $blob[34..($blob.Length - 1)]
          [byte[]]$plain = New-Object byte[] $cipher.Length
          [byte[]]$aad = [Text.Encoding]::ASCII.GetBytes('RD-DRIVE-CI-v1')
          $aes = [System.Security.Cryptography.AesGcm]::new($key, 16)
          try { $aes.Decrypt($nonce, $cipher, $tag, $plain, $aad) }
          finally { $aes.Dispose(); [Array]::Clear($key, 0, $key.Length) }
          [IO.File]::WriteAllBytes('rd-drive-ci-source.zip', $plain)
          [Array]::Clear($plain, 0, $plain.Length)
          $sourceHash = (Get-FileHash -Algorithm SHA256 'rd-drive-ci-source.zip').Hash.ToLowerInvariant()
          if ($sourceHash -ne 'dfe1cdf5f6b9fdf30cca6b76f9b984fc03ba1c58858476ea980232f3e04249c8') { throw "Decrypted source SHA256 mismatch: $sourceHash" }
          New-Item -ItemType Directory -Force -Path 'source' | Out-Null
          Expand-Archive -Path 'rd-drive-ci-source.zip' -DestinationPath 'source' -Force
          New-Item -ItemType Directory -Force -Path 'source/.github/workflows' | Out-Null
          Copy-Item '.github/workflows/windows-release-v3.yml' -Destination 'source/.github/workflows/windows-release.yml' -Force
          Remove-Item 'rd-drive-ci-source.enc','rd-drive-ci-source.zip' -Force

      - name: Prepare dependency, icon and Rust source compatibility fixes
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = 'src-tauri/Cargo.toml'
          $text = Get-Content -Raw $manifest
          if ($text -notmatch 'glass_pumpkin = "=2\.0\.0-rc0"') {
            $needle = 'grammers-stringsession = "0.1.1"'
            if ($text -notmatch [regex]::Escape($needle)) { throw 'Could not locate grammers dependency anchor.' }
            $text = $text.Replace($needle, $needle + "`r`nglass_pumpkin = `"=2.0.0-rc0`"")
            Set-Content -Path $manifest -Value $text -Encoding utf8 -NoNewline
          }

          $iconSource = '..\ci\icon.ico.b64'
          if (-not (Test-Path $iconSource)) { throw 'Verified icon carrier is missing.' }
          New-Item -ItemType Directory -Force -Path 'src-tauri/icons' | Out-Null
          $iconPath = 'src-tauri/icons/icon.ico'
          [IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String((Get-Content -Raw $iconSource)))
          $iconHash = (Get-FileHash -Algorithm SHA256 $iconPath).Hash.ToLowerInvariant()
          if ($iconHash -ne 'ab204293fc42d20bbf1715e76ae56c72fe8e13eac5f7b165c2eb14bb1c91e6f9') { throw "RD Drive Windows icon SHA256 mismatch: $iconHash" }

          $telegramPath = 'src-tauri/src/telegram.rs'
          $telegram = Get-Content -Raw $telegramPath
          $oldTelegram = 'InputMessage::text("").file(uploaded)'
          $newTelegram = 'InputMessage::new().text("").file(uploaded)'
          if ($telegram.Contains($oldTelegram)) {
            $telegram = $telegram.Replace($oldTelegram, $newTelegram)
            Set-Content -Path $telegramPath -Value $telegram -Encoding utf8 -NoNewline
          }
          if (-not (Get-Content -Raw $telegramPath).Contains($newTelegram)) { throw 'Telegram InputMessage builder compatibility fix was not applied.' }

          $teamPath = 'src-tauri/src/team_share.rs'
          $team = Get-Content -Raw $teamPath
          $oldTeam = 'pub fn members(root:&Path,p:&str,share_id:&str)->Result<Vec<ShareMemberRecord>,AppError>{let conn=db(root,p)?;let mut st=conn.prepare("SELECT member_id,role,key_version,revoked_at,added_at FROM share_members WHERE share_id=?1 ORDER BY added_at ASC")?;Ok(st.query_map(params![share_id],|r|Ok(ShareMemberRecord{member_id:r.get(0)?,role:r.get(1)?,key_version:r.get::<_,i64>(2)? as u32,revoked:r.get::<_,Option<String>>(3)?.is_some(),added_at:r.get(4)?}))?.collect::<Result<Vec<_>,_>>()?)}'
          $newTeam = 'pub fn members(root:&Path,p:&str,share_id:&str)->Result<Vec<ShareMemberRecord>,AppError>{let conn=db(root,p)?;let mut st=conn.prepare("SELECT member_id,role,key_version,revoked_at,added_at FROM share_members WHERE share_id=?1 ORDER BY added_at ASC")?;let rows=st.query_map(params![share_id],|r|Ok(ShareMemberRecord{member_id:r.get(0)?,role:r.get(1)?,key_version:r.get::<_,i64>(2)? as u32,revoked:r.get::<_,Option<String>>(3)?.is_some(),added_at:r.get(4)?}))?;let out=rows.collect::<Result<Vec<_>,_>>()?;Ok(out)}'
          if ($team.Contains($oldTeam)) {
            $team = $team.Replace($oldTeam, $newTeam)
            Set-Content -Path $teamPath -Value $team -Encoding utf8 -NoNewline
          }
          if (-not (Get-Content -Raw $teamPath).Contains('let out=rows.collect::<Result<Vec<_>,_>>()?;Ok(out)')) { throw 'Team Share rusqlite lifetime fix was not applied.' }

          $mainPath = 'src-tauri/src/main.rs'
          $main = Get-Content -Raw $mainPath
          $guiAttr = '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]'
          if (-not $main.Contains($guiAttr)) {
            $main = $guiAttr + "`r`n`r`n" + $main
            Set-Content -Path $mainPath -Value $main -Encoding utf8 -NoNewline
          }
          if (-not (Get-Content -Raw $mainPath).Contains($guiAttr)) { throw 'Windows GUI subsystem attribute was not applied.' }

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Rust MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo --version
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Install Python test dependency
        working-directory: source
        run: python -m pip install --disable-pip-version-check pytest

      - name: Install frontend dependencies
        working-directory: source
        run: npm install

      - name: TypeScript domain tests
        working-directory: source
        run: npm test

      - name: Python contract and schema tests
        working-directory: source
        run: python -m pytest tests -q

      - name: Frontend production build
        working-directory: source
        run: npm run build

      - name: Rust tests
        working-directory: source
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build Tauri Windows x64 release
        working-directory: source
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Collect, verify and hash Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'release-artifacts-final'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $rawExe = 'source/src-tauri/target/x86_64-pc-windows-msvc/release/rd-drive.exe'
          if (-not (Test-Path $rawExe)) { throw 'RD Drive release EXE was not produced.' }

          [byte[]]$pe = [IO.File]::ReadAllBytes($rawExe)
          if ($pe.Length -lt 512) { throw 'RD Drive release EXE is unexpectedly small.' }
          if ($pe[0] -ne 0x4d -or $pe[1] -ne 0x5a) { throw 'RD Drive release EXE has no MZ header.' }
          $peOffset = [BitConverter]::ToInt32($pe, 0x3c)
          if ($pe[$peOffset] -ne 0x50 -or $pe[$peOffset + 1] -ne 0x45) { throw 'RD Drive release EXE has no PE header.' }
          $machine = [BitConverter]::ToUInt16($pe, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("RD Drive release EXE is not x64. Machine=0x{0:x4}" -f $machine) }
          $optionalHeader = $peOffset + 24
          $magic = [BitConverter]::ToUInt16($pe, $optionalHeader)
          if ($magic -ne 0x20b) { throw ("RD Drive release EXE is not PE32+. Magic=0x{0:x4}" -f $magic) }
          $subsystem = [BitConverter]::ToUInt16($pe, $optionalHeader + 68)
          if ($subsystem -ne 2) { throw "RD Drive release EXE is not Windows GUI subsystem. Subsystem=$subsystem" }
          Write-Host 'Verified RD Drive release EXE: x64 PE32+ Windows GUI subsystem.'

          Copy-Item $rawExe -Destination (Join-Path $out 'RD-Drive.exe')
          $bundleRoot = 'source/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          if (Test-Path $bundleRoot) {
            Get-ChildItem -Path $bundleRoot -Recurse -File -Include '*.exe','*.msi' | ForEach-Object { Copy-Item $_.FullName -Destination $out }
          }
          $files = Get-ChildItem -Path $out -File
          if (-not $files) { throw 'No Windows release artifacts were produced.' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload RD Drive Windows final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RD-Drive-1.0.0-Windows-FINAL
          path: release-artifacts-final/*
          if-no-files-found: error
          retention-days: 7
