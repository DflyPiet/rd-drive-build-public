name: RD Drive 1.0.0 Browser Media Redesign

on:
  workflow_dispatch:
  push:
    branches:
      - redesign-build

permissions:
  contents: read

# Release contract markers. The commands themselves run inside ci/build-redesign-v2.ps1:
# npm run build
# cargo test
# tauri build

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout encrypted build carrier
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Rust MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Build and verify RD Drive browser media redesign
        shell: pwsh
        env:
          RD_BUILD_KEY: ${{ secrets.RD_BUILD_KEY }}
        run: .\ci\build-redesign-v2.ps1

      - name: Upload redesigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RD-Drive-1.0.0-BROWSER-MEDIA-REDESIGN
          path: release-artifacts-redesign/**/*
          if-no-files-found: error
          retention-days: 7
