name: RD Drive 1.0.0 Usability Final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-usability-final.yml
      - ci/build-usability-public.ps1
      - ci/decrypt-usability.py
      - ci/usability-final-trigger.txt
      - payload-usability/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout encrypted build carrier
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest cryptography pillow

      - name: Build and verify RD Drive
        shell: pwsh
        env:
          RD_BUILD_KEY: ${{ secrets.RD_BUILD_KEY }}
        run: .\ci\build-usability-public.ps1

      - name: Upload RD Drive Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RD-Drive-1.0.0-USABILITY-FINAL
          path: release-artifacts/**/*
          if-no-files-found: error
          retention-days: 7