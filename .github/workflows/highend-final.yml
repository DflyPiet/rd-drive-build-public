name: RD Drive 1.0.0 Professional Final

on:
  workflow_dispatch:
  push:
    branches:
      - highend-final
    paths:
      - highend/**
      - easy-ui/**
      - professional/**
      - ci/apply-highend-patch.ps1
      - ci/apply-easy-ui-patch.ps1
      - ci/apply-professional-patch.ps1
      - ci/apply-final-media-compat.ps1
      - ci/build-highend-final.ps1
      - .github/workflows/highend-final.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout encrypted build carrier
        uses: actions/checkout@v4
        with:
          ref: highend-final

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Rust MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup default stable
          rustup update stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Build and verify RD Drive professional final
        shell: pwsh
        env:
          RD_BUILD_KEY: ${{ secrets.RD_BUILD_KEY }}
        run: .\ci\build-highend-final.ps1

      - name: Independent artifact verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'release-artifacts-highend-final'
          $sumFile = Join-Path $root 'SHA256SUMS.txt'
          if (-not (Test-Path $sumFile)) { throw 'SHA256SUMS.txt is missing.' }

          $lines = Get-Content $sumFile | Where-Object { $_.Trim() }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})\s{2}(.+)$') { throw "Invalid SHA256SUMS line: $line" }
            $expected = $Matches[1]
            $relative = $Matches[2]
            $path = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Release file missing: $relative" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256 mismatch for $relative" }
          }

          $portable = Join-Path $root 'Portable\RD-Drive-Portable.exe'
          if (-not (Test-Path $portable)) { throw 'Portable EXE is missing.' }
          & '.\ci\verify-rd-drive-pe.ps1' -Path $portable
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($portable))
          if ($ascii.Contains('http://localhost:1420')) { throw 'Portable contains development localhost URL.' }

          $smokeRoot = Join-Path $env:RUNNER_TEMP 'rd-drive-portable-smoke'
          Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $smokePortable = Join-Path $smokeRoot 'RD-Drive-Portable.exe'
          Copy-Item -LiteralPath $portable -Destination $smokePortable -Force

          $proc = Start-Process -FilePath $smokePortable -WorkingDirectory $smokeRoot -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) { throw "Portable smoke start exited with code $($proc.ExitCode)." }
            Write-Host 'Portable smoke start exited cleanly.'
          }
          else {
            Stop-Process -Id $proc.Id -Force
            Write-Host 'Portable smoke start remained alive for five seconds and was stopped after verification.'
          }

          Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path (Join-Path $root 'Portable\RDDriveData')) {
            throw 'Release artifact was modified by smoke verification and contains preinitialized portable data.'
          }

      - name: Upload RD Drive professional final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RD-Drive-1.0.0-PROFESSIONAL-FINAL
          path: release-artifacts-highend-final/**/*
          if-no-files-found: error
          retention-days: 7
