name: RD Drive Derive Build Public Key

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/derive-build-public-key.yml
      - ci/derive-key-trigger.txt

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Derive X25519 public key
        env:
          RD_BUILD_KEY: ${{ secrets.RD_BUILD_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os, hashlib, base64
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          raw = os.environ.get("RD_BUILD_KEY", "")
          if len(raw) != 64:
              raise SystemExit("RD_BUILD_KEY missing or invalid")
          secret = bytes.fromhex(raw)
          seed = hashlib.sha256(secret + b"RD-DRIVE-X25519-v1").digest()
          private = X25519PrivateKey.from_private_bytes(seed)
          public = private.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)
          print("RD_X25519_PUBLIC=" + base64.b64encode(public).decode("ascii"))
          PY
